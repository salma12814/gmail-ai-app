# Spring Application Configuration
spring.application.name=gmail-ai-app 

# Database (PostgreSQL) - ✅ UTILISER LES ENV VARS
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gmail_ai_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
spring.datasource.hikari.auto-commit=false

# Redis - ✅ UTILISER LES ENV VARS
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Server
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/

# Encryption
encryption.key=${ENCRYPTION_KEY:Eh9ClRPYtVmnCnSXMyMAx3xoIX1qDrvj9PJv445BjjI}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:your-google-client-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/google/callback}

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key}

# Logging
logging.level.root=INFO
logging.level.com.agent=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.orm=DEBUG
logging.level.org.postgresql=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics